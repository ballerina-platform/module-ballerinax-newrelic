[package]
org = "ballerinax"
name = "newrelic"
version = "1.1.0"
keywords = ["Type/Driver", "Area/Developer Tools", "Vendor/New Relic", "Observability", "tracing", "metrics"]
distribution = "2201.14.0"

[build-options]
# Pin dependency resolution to the versions in Dependencies.toml: the build
# compiles against a distribution assembled by copyStdlibs, so letting bal
# resolve to the latest on Central would drift out of sync.
sticky = true

[platform.java25]
graalvmCompatible = true

[[platform.java25.dependency]]
path = "../native/build/libs/newrelic-extension-native-1.1.0-SNAPSHOT.jar"
groupId = "ballerina"
artifactId = "newrelic-extension-native"
version = "1.1.0-SNAPSHOT"

